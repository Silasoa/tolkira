name: Bug report
description: Something is broken or produces a wrong report.
title: "bug: "
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Input format, command/API call, and a sanitized fixture if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tolkira version
      placeholder: 0.1.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.14.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
