name: Bug report
description: Something is broken or produces a wrong report. See docs/agents/issue-tracker.md.
title: "bug: "
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Input format, command/API call, and a sanitized fixture if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tolkira version
      placeholder: 0.1.0
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.14.0
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Optional; the maintainer applies the matching area label.
      options:
        - Input (legacy JSON, Messages, JUnit)
        - Report UI
        - CLI / API / summary
        - Compatibility / migration
        - Tests / fixtures
        - Build / release / CI
        - Docs / agent workflow
        - Not sure
