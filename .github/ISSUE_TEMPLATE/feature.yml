name: Feature request
description: Suggest a capability or report improvement. Intake only; a spec follows before implementation.
title: "feat: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are intake, not a spec. See
        `docs/agents/issue-tracker.md` for when an item becomes an actionable
        issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Optional; the maintainer applies the matching area label.
      options:
        - Input (legacy JSON, Messages, JUnit)
        - Report UI
        - CLI / API / summary
        - Compatibility / migration
        - Tests / fixtures
        - Build / release / CI
        - Docs / agent workflow
        - Other
