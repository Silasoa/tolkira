name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  gate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run hygiene
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  gate-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  publish:
    needs: [gate-linux, gate-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require the tag to match the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Require the tag to be on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - run: npm ci
      - run: npm pack --pack-destination /tmp
      - run: npm install -g --prefix /tmp/global /tmp/tolkira-*.tgz
      - run: test -x /tmp/global/bin/tolkira
      - run: |
          /tmp/global/bin/tolkira --help | grep -q "Usage: tolkira"
      - run: echo "TOLKIRA_ROOT=$(npm root -g --prefix /tmp/global)" >> "$GITHUB_ENV"
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" --help
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" test/fixtures/legacy/minimal.json --out /tmp/report.html --title "Package smoke test"
      - run: test -s /tmp/report.html && grep -q "Minimal feature" /tmp/report.html
      - run: npm install -g npm@latest
      - run: npm stage publish . --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
