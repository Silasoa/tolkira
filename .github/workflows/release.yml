name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run hygiene
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  gate-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  publish:
    needs: [gate-linux, gate-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the tag to match the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - run: npm ci
      - name: Pin npm 12.2.3 # zizmor: ignore[adhoc-packages] -- packs and publishes the checked tarball
        run: npm install -g npm@12.2.3
      - run: npm audit signatures
      - name: Resolve the package version
        run: echo "TOLKIRA_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Check the packed package
        run: TOLKIRA_PACK_DIR=/tmp/pack npm run package:check
      - name: Install the checked tarball # zizmor: ignore[adhoc-packages] -- the checked tarball is the smoke-test and publish input
        run: npm install -g --prefix /tmp/global /tmp/pack/tolkira-$TOLKIRA_VERSION.tgz
      - run: test -x /tmp/global/bin/tolkira
      - run: |
          /tmp/global/bin/tolkira --help | grep -q "Usage: tolkira"
      - run: echo "TOLKIRA_ROOT=$(npm root -g --prefix /tmp/global)" >> "$GITHUB_ENV"
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" --help
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" test/fixtures/legacy/minimal.json --out /tmp/report.html --title "Package smoke test"
      - run: test -s /tmp/report.html && grep -q "Minimal feature" /tmp/report.html
      - name: Generate the CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > "/tmp/pack/tolkira-$TOLKIRA_VERSION.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tolkira-sbom
          path: /tmp/pack/tolkira-$TOLKIRA_VERSION.cdx.json
          retention-days: 14
      - run: npm stage publish /tmp/pack/tolkira-$TOLKIRA_VERSION.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
