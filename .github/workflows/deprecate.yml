name: Deprecate npm version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deprecate, for example 0.1.1
        required: true
        type: string
      message:
        description: Deprecation message
        required: true
        type: string

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm deprecate "tolkira@$VERSION" "$MESSAGE"
        env:
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ inputs.message }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
