name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == 22
        run: npm audit --audit-level=moderate
      - run: npm run check
      - if: matrix.node == 22
        run: npm pack --dry-run
      - if: matrix.node == 22
        run: npm run stress -- 1000

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - run: npm install -g --prefix /tmp/global /tmp/tolkira-*.tgz
      - run: test -x /tmp/global/bin/tolkira
      - run: |
          /tmp/global/bin/tolkira --help | grep -q "Usage: tolkira"
      - run: echo "TOLKIRA_ROOT=$(npm root -g --prefix /tmp/global)" >> "$GITHUB_ENV"
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" --help
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" test/fixtures/legacy/minimal.json --out /tmp/report.html --title "Package smoke test"
      - run: test -s /tmp/report.html && grep -q "Minimal feature" /tmp/report.html

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-visual
          path: test-results/
          retention-days: 14
