name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run hygiene

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == 22
        run: npm audit --audit-level=moderate
      - run: npm run check
      - if: matrix.node == 22
        run: npm pack --dry-run
      - if: matrix.node == 22
        run: npm run stress -- 1000
      - if: matrix.node == 22
        run: npm run bench:ansi

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Pin npm 12.2.3 # zizmor: ignore[adhoc-packages] -- packs the same list as the release
        run: npm install -g npm@12.2.3
      - run: npm ci
      - name: Resolve the package version
        run: echo "TOLKIRA_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Check the packed package
        run: TOLKIRA_PACK_DIR=/tmp/pack npm run package:check
      - name: Install the checked tarball # zizmor: ignore[adhoc-packages] -- the checked tarball is the smoke-test input
        run: npm install -g --prefix /tmp/global /tmp/pack/tolkira-$TOLKIRA_VERSION.tgz
      - run: test -x /tmp/global/bin/tolkira
      - run: |
          /tmp/global/bin/tolkira --help | grep -q "Usage: tolkira"
      - run: echo "TOLKIRA_ROOT=$(npm root -g --prefix /tmp/global)" >> "$GITHUB_ENV"
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" --help
      - run: node "$TOLKIRA_ROOT/tolkira/dist/cli.js" test/fixtures/legacy/minimal.json --out /tmp/report.html --title "Package smoke test"
      - run: test -s /tmp/report.html && grep -q "Minimal feature" /tmp/report.html
      - name: Missing PDF engine exits 1
        run: |
          assert_missing_engine() {
            local dir="$1"
            local log="$dir/missing.log"
            local pdf="$dir/missing.pdf"
            local code
            rm -f "$pdf" "$log"
            set +e
            (cd "$dir" && node "$TOLKIRA_ROOT/tolkira/dist/cli.js" "$GITHUB_WORKSPACE/test/fixtures/legacy/minimal.json" --pdf "$pdf") > "$log" 2>&1
            code=$?
            set -e
            test "$code" -eq 1
            grep -qF "PDF output needs the optional Playwright Chromium engine." "$log"
            grep -qF "In your project: npm i -D playwright-core@^1.65.0" "$log"
            grep -qF "Then: npx playwright-core install chromium-headless-shell" "$log"
            grep -qF "A project-local Tolkira install is recommended. Or omit --pdf." "$log"
            test ! -e "$pdf"
          }

          missing_dir=$(mktemp -d)
          assert_missing_engine "$missing_dir"
          test ! -e "$missing_dir/node_modules/playwright-core"

          browser_dir=$(mktemp -d)
          mkdir -p "$browser_dir/node_modules/playwright-core"
          cat > "$browser_dir/node_modules/playwright-core/package.json" <<'EOF'
          {"name":"playwright-core","version":"1.65.0","main":"index.js"}
          EOF
          cat > "$browser_dir/node_modules/playwright-core/index.js" <<'EOF'
          console.error('FAKE_PEER_LOADED');
          module.exports = {
            chromium: {
              launch: async () => {
                throw new Error("browserType.launch: Executable doesn't exist at /tmp/tolkira-fake-chrome");
              },
            },
          };
          EOF
          test -f "$browser_dir/node_modules/playwright-core/index.js"
          assert_missing_engine "$browser_dir"
          grep -qF "FAKE_PEER_LOADED" "$browser_dir/missing.log"
          if grep -qF "FAKE_PEER_LOADED" "$missing_dir/missing.log"; then
            echo "missing-peer case unexpectedly loaded the fake peer" >&2
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-visual-linux
          path: test-results/
          retention-days: 14

  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run build
      - run: npm pack --pack-destination /tmp
      - name: Install the freshly packed tarball # zizmor: ignore[adhoc-packages] -- the packed tarball is the smoke-test input
        run: npm install -g --prefix /tmp/global /tmp/tolkira-*.tgz
      - run: |
          /tmp/global/bin/tolkira --help | grep -q "Usage: tolkira"
      - run: node "$(npm root -g --prefix /tmp/global)/tolkira/dist/cli.js" test/fixtures/legacy/minimal.json --out /tmp/report.html --title "Package smoke test"
      - run: test -s /tmp/report.html && grep -q "Minimal feature" /tmp/report.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-visual-macos
          path: test-results/
          retention-days: 14

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Run zizmor
        run: pipx run --spec zizmor==1.33.1 zizmor --offline --persona=regular --format=plain .
